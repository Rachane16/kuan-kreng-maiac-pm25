name: Update MAIAC and CAMS dashboard

on:
  schedule:
    # 20:23 Asia/Bangkok. The latest UTC product day is checked every evening.
    - cron: '23 13 * * *'
    # CAMS cycles: 17:30 and 05:30 Asia/Bangkok; retry two hours later.
    - cron: '30 10,12,22,0 * * *'
  workflow_dispatch:
    inputs:
      forecast_only:
        description: 'Refresh CAMS forecast only'
        type: boolean
        default: false

concurrency:
  group: maiac-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site and code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install processing packages
        run: python -m pip install -r requirements.txt
      - name: Decrypt trusted model
        env:
          MODEL_DECRYPT_KEY_B64: ${{ secrets.MODEL_DECRYPT_KEY_B64 }}
        run: >-
          python -m maiac.crypto_model decrypt
          --input models/Extra_Trees_model.pkl.aesgcm
          --output .private/Extra_Trees_model.pkl
      - name: Refresh rolling MAIAC data
        if: github.event.schedule == '23 13 * * *' || (github.event_name == 'workflow_dispatch' && !inputs.forecast_only)
        env:
          NASA_EARTHDATA_TOKEN: ${{ secrets.NASA_EARTHDATA_TOKEN }}
        run: >-
          python -m maiac.refresh_site
          --boundary data/boundaries/kkpsf_boundary.geojson
          --grid data/boundaries/kkpsf_grid_1km.gpkg
          --model .private/Extra_Trees_model.pkl
      - name: Refresh rolling CAMS data
        continue-on-error: true
        timeout-minutes: 30
        env:
          CAMS_ADS_TOKEN: ${{ secrets.CAMS_ADS_TOKEN }}
          FORECAST_ONLY: ${{ github.event.schedule != '23 13 * * *' && (github.event_name != 'workflow_dispatch' || inputs.forecast_only) }}
        run: |
          if [ -n "$CAMS_ADS_TOKEN" ]; then
            args=()
            if [ "$FORECAST_ONLY" = 'true' ]; then args+=(--forecast-only); fi
            python -m cams.refresh \
              --boundary data/boundaries/kkpsf_boundary.geojson \
              --model .private/Extra_Trees_model.pkl "${args[@]}"
          else
            echo 'CAMS secret is not configured; retaining the published CAMS history.'
          fi
      - name: Save verified site data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/
          if ! git diff --cached --quiet; then
            git commit -m 'Update rolling MAIAC dashboard data'
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
