name: Update MAIAC dashboard

on:
  workflow_dispatch:

concurrency:
  group: maiac-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site and code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install processing packages
        run: python -m pip install -r requirements.txt
      - name: Decrypt trusted model
        env:
          MODEL_DECRYPT_KEY_B64: ${{ secrets.MODEL_DECRYPT_KEY_B64 }}
        run: >-
          python -m maiac.crypto_model decrypt
          --input models/Extra_Trees_model.pkl.aesgcm
          --output .private/Extra_Trees_model.pkl
      - name: Refresh rolling MAIAC data
        env:
          NASA_EARTHDATA_TOKEN: ${{ secrets.NASA_EARTHDATA_TOKEN }}
        run: >-
          python -m maiac.refresh_site
          --boundary data/boundaries/kkpsf_boundary.geojson
          --grid data/boundaries/kkpsf_grid_1km.gpkg
          --model .private/Extra_Trees_model.pkl
      - name: Save verified site data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/history.json docs/data/grid.geojson
          if ! git diff --cached --quiet; then
            git commit -m 'Update rolling MAIAC dashboard data'
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
