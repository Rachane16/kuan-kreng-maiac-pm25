name: Update VIIRS NOAA
on:
  schedule:
    - cron: '43 */3 * * *'
  workflow_dispatch:
    inputs:
      max_days:
        description: 'Maximum changed/backfill days (1–92)'
        default: '12'
  push:
    branches: [main]
    paths: ['viirs/**', 'tests/test_viirs.py', '.github/workflows/viirs_noaa.yml']
concurrency:
  group: maiac-pages
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install existing scientific packages
        run: python -m pip install -r requirements.txt
      - name: Check NOAA science processing
        run: python -m unittest discover -s tests -p 'test_viirs.py' -v
      - name: Decrypt existing trusted model
        env:
          MODEL_DECRYPT_KEY_B64: ${{ secrets.MODEL_DECRYPT_KEY_B64 }}
        run: python -m maiac.crypto_model decrypt --input models/Extra_Trees_model.pkl.aesgcm --output .private/Extra_Trees_model.pkl
      - name: Refresh boundary-only VIIRS NOAA
        id: viirs
        continue-on-error: true
        env:
          NASA_EARTHDATA_TOKEN: ${{ secrets.NASA_EARTHDATA_TOKEN }}
          VIIRS_MAX_DAYS: ${{ inputs.max_days || '12' }}
        run: python -m viirs.refresh --boundary data/boundaries/kkpsf_boundary.geojson --model .private/Extra_Trees_model.pkl --max-days "$VIIRS_MAX_DAYS"
      - name: Preserve verified snapshots and source status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/viirs_history.json docs/data/viirs_grid.geojson
          if ! git diff --cached --quiet; then
            git commit -m 'Update boundary-clipped VIIRS NOAA observations'
            git push
          fi
      - name: Report failed initial data access
        if: steps.viirs.outcome == 'failure'
        run: exit 1
